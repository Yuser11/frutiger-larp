    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn_sala = document.getElementById('btn_sala');
            const btn_quarto = document.getElementById('btn_quarto');
            const btn_cozinha = document.getElementById('btn_cozinha');
            const btn_jardim = document.getElementById('btn_jardim');
            const btn_passarela = document.getElementById('btn_passarela');
            const btn_irrigacao = document.getElementById('btn_irrigacao');
            const btn_bomba_agua = document.getElementById('btn_bomba_agua');
            const icon_lampada_sala = document.getElementById('icon_lampada_sala');
            const icon_lampada_quarto = document.getElementById('icon_lampada_quarto');
            const icon_lampada_jardim = document.getElementById('icon_lampada_jardim');
            const icon_lampada_cozinha = document.getElementById('icon_lampada_cozinha');
            const icon_lampada_passarela = document.getElementById('icon_lampada_passarela');
            const icon_ventilador_sala = document.getElementById('icon_ventilador_sala');
            const icon_irrigacao = document.getElementById('icon_irrigacao');
            const icon_bateria = document.getElementById('icon_bateria');
            const bateria = document.getElementById('bateria');
            const status_broker = document.getElementById('status_broker');
            const status_umidade = document.getElementById('status_umidade');
            const status_luminosidade = document.getElementById('status_luminosidade');
            const status_nivel_agua = document.getElementById('nivel_agua');
            const status_nivel_eficiencia = document.getElementById('nivel_eficiencia');

            /* Conexão com o BROKER MQTT */
            const broker = 'wss://broker.hivemq.com:8884/mqtt';
            
            const clientId = 'web_client_' + Math.random().toString(16).substr(2, 8);

            const options = {
                clientId: clientId,
                connectTimeout: 4000, 
                keepalive: 60,      
            };
            /* Inicia uma instância com o broker e salva no
            objeto cliente */
            const cliente = mqtt.connect(broker, options);
            const sala = 'larDigital/maquete/luz/sala';
            const quarto = 'larDigital/maquete/luz/quarto';
            const cozinha = 'larDigital/maquete/luz/cozinha';
            const passarela = 'larDigital/maquete/luz/passarela';
            const jardim = 'larDigital/maquete/luz/jardim';
            const irrigacao = 'larDigital/maquete/irrigacao';
            const status_bomba_agua = 'maquete/sistema/bomba_agua';
            const nivel_bateria = 'maquete/sistema/nivel_umidade';
            const topico_bateria = 'maquete/energia/nivel_bateria';
            const nivel_umidade = 'maquete/sistema/nivel_umidade';
            const nivel_luminosidade = 'maquete/ambiente/luminosidade';
            const nivel_agua = 'maquete/sistema/nivel_agua';
            const nivel_eficiencia = 'maquete/energia/eficiencia';
            /* flags de situação dos botões */
            let status_btn_sala = false;
            let status_btn_quarto = false;
            let status_btn_cozinha = false;
            let status_btn_passarela = false;
            let status_btn_jardim = false;
            let status_btn_irrigacao = false;
            let status_btn_bomba_agua = false;


            /*Conecta ao Broker e inscreve nos tópicos*/
            cliente.on('connect', () => {
                status_broker.className = "fa-solid fa-power-off text-success";
                console.log('Conectado ao BROKER');
                cliente.subscribe((sala), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${sala}`);
                    }
                });
                cliente.subscribe((quarto), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${quarto}`);
                    }
                });
                cliente.subscribe((cozinha), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${cozinha}`);
                    }
                });
                cliente.subscribe((passarela), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${passarela}`);
                    }
                });
                cliente.subscribe((jardim), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${jardim}`);
                    }
                });
                cliente.subscribe((irrigacao), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${irrigacao}`);
                    }
                });
                cliente.subscribe((topico_bateria), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${topico_bateria}`);
                    }
                });
                cliente.subscribe((nivel_umidade), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${nivel_umidade}`);
                    }
                });
                cliente.subscribe((nivel_luminosidade), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${nivel_luminosidade}`);
                    }
                });
                cliente.subscribe((nivel_agua), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${nivel_agua}`);
                    }
                });
                cliente.subscribe((nivel_eficiencia), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${nivel_eficiencia}`);
                    }
                });
                cliente.subscribe((status_bomba_agua), (err) => {
                    if (!err) {
                        console.log(`Conectado no tópico: ${status_bomba_agua}`);
                    }
                });
            });
            /* Verifica se existe mensagem no tópico inscrito */
            cliente.on('message', (topicos, message) => {
                const mensagem = message.toString();

                /* btn_bomba_agua */
                if (topicos === status_bomba_agua) {
                    if (mensagem === "on") {
                        btn_bomba_agua.bootstrapToggle('on');
                    }
                    if (mensagem === "off") {
                        btn_bomba_agua.bootstrapToggle('off');
                    }
                }
                /*  Nível eficiencia */
                if (topicos === nivel_eficiencia) {
                    status_nivel_eficiencia.innerText = `${mensagem}%`;
                }

                /* Nível aguá */
                if (topicos === nivel_agua) {
                    status_nivel_agua.innerText = `${mensagem}%`;
                }

                /* Luminosidade */
                if (topicos === nivel_luminosidade) {
                    let valor_luminosidade = parseInt(mensagem);
                    valor_luminosidade = valor_luminosidade / 1024 * 100;
                    status_luminosidade.innerText = `${valor_luminosidade.toFixed(2)}%`;
                }

                /* Umidade Solo */
                if (topicos === nivel_umidade) {
                    status_umidade.innerText = `${mensagem}%`;
                }

                /* Bateria */
                if (topicos === topico_bateria) {
                    valor_bateria = parseInt(mensagem);
                    if (mensagem === 100) {
                        icon_bateria.className = 'fas fa-solid fa-battery-full text-success fs-1';
                        bateria.innerText = `${mensagem}%`;
                    }
                    if (mensagem >= 75 && mensagem <= 99) {
                        icon_bateria.className = 'fas fa-solid fa-battery-three-quarters text-success fs-1';
                        bateria.innerText = `${mensagem}%`;
                    }
                    if (mensagem >= 50 && mensagem < 75) {
                        icon_bateria.className = 'fas fa-solid fa-battery-three-quarters text-warning fs-1';
                        bateria.innerText = `${mensagem}%`;
                    }
                    if (mensagem < 50) {
                        icon_bateria.className = 'fas fa-solid fa-battery-three-quarters text-danger fs-1';
                        bateria.innerText = `${mensagem}%`;
                    }
                }
                /* Irrigação */
                if (topicos === irrigacao) {
                    if (mensagem === "on") {
                        icon_irrigacao.className = 'fa-solid fa-faucet-drip fs-1 text-primary';
                        btn_irrigacao.bootstrapToggle('on');
                    }
                    if (mensagem === "off") {
                        icon_irrigacao.className = 'fa-solid fa-faucet fs-1';
                        btn_irrigacao.bootstrapToggle('off');

                    }
                }
                // SALA
                if (topicos === sala) {
                    const estadoAtual = btn_sala.checked;
                    if (mensagem === 'off') {
                        const estado = false;
                        if (estado !== estadoAtual) {
                            status_btn_sala = true; // <-- trava
                            icon_lampada_sala.className = 'fas fa-lightbulb fs-1';
                            btn_sala.bootstrapToggle(mensagem);
                            status_btn_sala = false; // <-- libera
                        }
                    }
                    if (mensagem === 'on') {
                        const estado = true;
                        if (estado !== estadoAtual) {
                            status_btn_sala = true; // <-- trava
                            icon_lampada_sala.className = 'fas fa-lightbulb fs-1 text-warning';
                            btn_sala.bootstrapToggle(mensagem);
                            status_btn_sala = false; // <-- libera
                        }
                    }
                }

                // QUARTO
                if (topicos === quarto) {
                    const estadoAtual = btn_quarto.checked;
                    if (mensagem === 'off') {
                        const estado = false;
                        if (estado !== estadoAtual) {
                            status_btn_quarto = true; // <-- trava
                            icon_lampada_quarto.className = 'fas fa-lightbulb fs-1';
                            btn_quarto.bootstrapToggle(mensagem);
                            status_btn_quarto = false; // <-- libera
                        }
                    }
                    if (mensagem === 'on') {
                        const estado = true;
                        if (estado !== estadoAtual) {
                            status_btn_quarto = true; // <-- trava
                            icon_lampada_quarto.className = ' fas fa-lightbulb fs-1 text-warning';
                            btn_quarto.bootstrapToggle(mensagem);
                            status_btn_quarto = false; // <-- libera
                        }
                    }
                }
                // COZINHA
                if (topicos === cozinha) {
                    const estadoAtual = btn_cozinha.checked;
                    if (mensagem === 'off') {
                        const estado = false;
                        if (estado !== estadoAtual) {
                            status_btn_cozinha = true; // <-- trava
                            icon_lampada_cozinha.className = 'fas fa-lightbulb fs-1';
                            btn_cozinha.bootstrapToggle(mensagem);
                            status_btn_cozinha = false; // <-- libera
                        }
                    }
                    if (mensagem === 'on') {
                        const estado = true;
                        if (estado !== estadoAtual) {
                            status_btn_cozinha = true; // <-- trava
                            icon_lampada_cozinha.className = ' fas fa-lightbulb fs-1 text-warning';
                            btn_cozinha.bootstrapToggle(mensagem);
                            status_btn_cozinha = false; // <-- libera
                        }
                    }
                }
                // PASSARELA
                if (topicos === passarela) {
                    const estadoAtual = btn_passarela.checked;
                    if (mensagem === 'off') {
                        const estado = false;
                        if (estado !== estadoAtual) {
                            status_btn_passarela = true; // <-- trava
                            icon_lampada_passarela.className = 'fas fa-lightbulb fs-1';
                            btn_passarela.bootstrapToggle(mensagem);
                            status_btn_passarela = false; // <-- libera
                        }
                    }
                    if (mensagem === 'on') {
                        const estado = true;
                        if (estado !== estadoAtual) {
                            status_btn_passarela = true; // <-- trava
                            icon_lampada_passarela.className = ' fas fa-lightbulb fs-1 text-warning';
                            btn_passarela.bootstrapToggle(mensagem);
                            status_btn_passarela = false; // <-- libera
                        }
                    }
                }
                // JARDIM
                if (topicos === jardim) {
                    const estadoAtual = btn_jardim.checked;
                    if (mensagem === 'off') {
                        const estado = false;
                        if (estado !== estadoAtual) {
                            status_btn_jardim = true; // <-- trava
                            icon_lampada_jardim.className = 'fas fa-lightbulb fs-1';
                            btn_jardim.bootstrapToggle(mensagem);
                            status_btn_jardim = false; // <-- libera
                        }
                    }
                    if (mensagem === 'on') {
                        const estado = true;
                        if (estado !== estadoAtual) {
                            status_btn_jardim = true; // <-- trava
                            icon_lampada_jardim.className = ' fas fa-lightbulb fs-1 text-warning';
                            btn_jardim.bootstrapToggle(mensagem);
                            status_btn_jardim = false; // <-- libera
                        }
                    }
                }



            });

            // Monitora a mudança de estado do botão
            btn_sala.bootstrapToggle();
            // Quando tem mudança no botão executa a função 
            btn_sala.onchange = () => {
                if (status_btn_sala) return; // impede publish quando a 
                // mudança veio do MQTT
                btn_sala.checked ? post_sala('ligado') : post_sala('desligado');
            };

            function post_sala(estado) {
                if (estado === 'desligado') {
                    icon_lampada_sala.className = 'fas fa-lightbulb fs-1';
                    cliente.publish(sala, 'off');
                } else {
                    icon_lampada_sala.className = ' fas fa-lightbulb fs-1 text-warning';
                    cliente.publish(sala, 'on');
                }
            }

            // Quarto
            btn_quarto.bootstrapToggle();
            btn_quarto.onchange = () => {
                if (status_btn_quarto) return;
                btn_quarto.checked ? post_quarto('ligado') : post_quarto('desligado');
            };

            function post_quarto(estado) {
                if (estado === 'desligado') {
                    icon_lampada_quarto.className = 'fas fa-lightbulb fs-1';
                    cliente.publish(quarto, 'off');
                } else {
                    icon_lampada_quarto.className = ' fas fa-lightbulb fs-1 text-warning';
                    cliente.publish(quarto, 'on');
                }
            }
            // Cozinha
            btn_cozinha.bootstrapToggle();
            btn_cozinha.onchange = () => {
                if (status_btn_cozinha) return;
                btn_cozinha.checked ? post_cozinha('ligado') : post_cozinha('desligado');
            };
            function post_cozinha(estado) {
                if (estado === 'desligado') {
                    icon_lampada_cozinha.className = 'fas fa-lightbulb fs-1';
                    cliente.publish(cozinha, 'off');
                } else {
                    icon_lampada_cozinha.className = ' fas fa-lightbulb fs-1 text-warning';
                    cliente.publish(cozinha, 'on');
                }
            }
            // Passarela
            btn_passarela.bootstrapToggle();
            btn_passarela.onchange = () => {
                if (status_btn_passarela) return;
                btn_passarela.checked ? post_passarela('ligado') : post_passarela('desligado');
            };

            function post_passarela(estado) {
                if (estado === 'desligado') {
                    icon_lampada_passarela.className = 'fas fa-lightbulb fs-1';
                    cliente.publish(passarela, 'off');
                } else {
                    icon_lampada_passarela.className = ' fas fa-lightbulb fs-1 text-warning';
                    cliente.publish(passarela, 'on');
                }
            }
            // Jardim
            btn_jardim.bootstrapToggle();
            btn_jardim.onchange = () => {
                if (status_btn_jardim) return;
                btn_jardim.checked ? post_jardim('ligado') : post_jardim('desligado');
            };
            function post_jardim(estado) {
                if (estado === 'desligado') {
                    icon_lampada_jardim.className = 'fas fa-lightbulb fs-1';
                    cliente.publish(jardim, 'off');
                } else {
                    icon_lampada_jardim.className = ' fas fa-lightbulb fs-1 text-warning';
                    cliente.publish(jardim, 'on');
                }
            }


        })
    </script>
